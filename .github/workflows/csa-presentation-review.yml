name: CSA public presentation
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'gate.css'
      - 'gate.js'
      - 'tests/test_public_identity.mjs'
      - 'tests/csa-founder-presentation.mjs'
      - '.github/workflows/csa-presentation-review.yml'
  push:
    branches: [main]
    paths:
      - 'company/index.html'
      - 'knowledge/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all published text and build reviewed files
        run: |
          node --test tests/test_public_identity.mjs
          node scripts/build_static.mjs
      - name: Install existing pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Serve reviewed output
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .static-output > /tmp/csa-presentation.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify unnamed Founder review in Chromium and WebKit
        run: node tests/csa-founder-presentation.mjs
      - name: Archive only reviewed public website bytes
        if: success()
        run: |
          mkdir -p artifacts/presentation
          tar -czf artifacts/presentation/public-site.tar.gz -C .static-output .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csa-presentation-evidence
          path: artifacts/presentation/
          if-no-files-found: warn
